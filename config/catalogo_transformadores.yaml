# =============================================================================
# Catálogo de transformadores — P0 (vacío), Pk (carga nominal) y %Z por kVA.
# El modelo NO contiene P0/Pk/%Z por unidad; se obtienen de aquí por
# kVA/fases/clase, y el resultado lleva origen_valor = CATALOGO. Es el mayor
# origen de incertidumbre en las pérdidas de transformación.
#
# p0_kw = pérdida en vacío (constante, NO se afecta por el factor de pérdidas).
# pk_kw = pérdida con carga nominal.
# =============================================================================
transformadores:
  # Monofásicos (distribución)
  - {kva: 5,   fases: 1, clase: "BT", p0_kw: 0.030, pk_kw: 0.090, z_pct: 2.5}
